<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Musicadispersa</title>
  <meta name="description" content="Musicadispersa — publications and sound projects" />
  <link rel="stylesheet" href="/styles.css">
  <style>
    html,body{height:100%;margin:0;background:#fff;color:#111;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px;text-align:center}
    .brand{font-size:20px;font-weight:700}
    .lead{color:#444;max-width:44rem}
    .btn{display:inline-block;padding:12px 20px;border-radius:8px;background:#111;color:#fff;text-decoration:none;font-weight:600}
    .secondary{background:transparent;color:#111;border:2px solid #111;margin-left:8px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
    footer{position:fixed;left:12px;bottom:12px;font-size:12px;color:#666}
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-labelledby="main-title">
    <div class="brand" id="main-title">Musicadispersa</div>
    <p class="lead">Welcome — temporary homepage. Use the button below to go to Books (current site).</p>

    <div class="actions">
      <a class="btn" href="/books/">Books</a>
      <a class="btn secondary" href="/radio/">Radio</a>
      <a class="btn secondary" href="/label/">Label</a>
    </div>
  </main>

  <footer>Temporary homepage — under development</footer>
</body>
</html>
